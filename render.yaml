services:
  - type: web
    name: cocangua-account-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: LudoGameDB
      - key: PLAYERS_COLLECTION
        value: Players
      - key: MATCH_HISTORY_COLLECTION
        value: MatchHistories
